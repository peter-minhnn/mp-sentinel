image: node:24

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

stages:
  - audit

code_audit:
  stage: audit
  before_script:
    - npm ci
    - git fetch --unshallow 2>/dev/null || true
    - git fetch origin ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}
  script:
    - npm run build
    - node dist/index.js indexing
    - node dist/index.js --target-branch origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    # AI Provider Configuration (choose one)
    # Option 1: Google Gemini (default, free tier available)
    # GEMINI_API_KEY: $GEMINI_API_KEY

    # Option 2: OpenAI GPT (uncomment to use)
    # AI_PROVIDER: openai
    # AI_MODEL: gpt-5.2
    # OPENAI_API_KEY: $OPENAI_API_KEY

    # Option 3: Anthropic Claude (uncomment to use)
    AI_PROVIDER: anthropic
    AI_MODEL: deepseek-v4-pro  # or claude-opus-4
    ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
    # ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY

    # Optional: Fine-tune AI behavior
    # AI_TEMPERATURE: "0.2"
    # AI_MAX_TOKENS: "8192"

    # GitLab integration (CI_JOB_TOKEN is auto-available for MR comments)
    # GITLAB_TOKEN: $GITLAB_TOKEN
